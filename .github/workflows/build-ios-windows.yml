name: Build iOS and Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios
      - name: Check for device credentials
        run: |
          if find LocationMocker -type f \( -iname '*pairing*.plist' -o -iname '*.mobiledevicepairing' -o -iname '*.mobileprovision' -o -iname '*.p12' \) | grep -q .; then
            echo 'Remove device credentials before building.'
            exit 1
          fi
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          cd LocationMocker
          xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project LocationMocker/LocationMocker.xcodeproj -scheme LocationMocker -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/LocationMocker.app package/Payload/
          test -f package/Payload/LocationMocker.app/LocationMocker
          cd package
          ditto -c -k --keepParent Payload LocationMocker-original-unsigned.ipa
          shasum -a 256 LocationMocker-original-unsigned.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LocationMocker-original-unsigned
          path: |
            package/LocationMocker-original-unsigned.ipa
            package/SHA256.txt
          if-no-files-found: error
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r windows/requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s windows -p 'test_*.py' -v
      - run: rustup update stable
      - run: cargo build --release --manifest-path windows/free-sign/Cargo.toml
      - run: .\windows\free-sign\target\release\locationmocker-free-sign.exe --help
      - run: python -m PyInstaller --noconfirm --onedir --name LocationMocker-Windows --collect-all pymobiledevice3 --collect-all cryptography --recursive-copy-metadata pymobiledevice3 --add-binary "windows/free-sign/target/release/locationmocker-free-sign.exe;." --add-data "windows/free-sign/UPSTREAM-LICENSE.txt;." windows/gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: LocationMocker-Windows
          path: dist/LocationMocker-Windows/
          if-no-files-found: error
          retention-days: 7
